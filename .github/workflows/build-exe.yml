name: Build Windows exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke test (import)
        run: python -c "import pptx, fitz, PIL; import studio.pipeline, studio.render_pptx; print('ok')"
      - name: Smoke test (render / import / deck merge)
        run: python tools/smoke_render.py
      - name: Smoke test (server end-to-end, demo mode)
        run: python tools/smoke_e2e.py
      - name: Smoke test (copy-paste mode)
        run: python tools/smoke_manual.py
      - name: Build
        run: >
          pyinstaller --noconfirm --onedir --name PPTStudio
          --add-data "web;web" --add-data "prompts;prompts" --add-data "rules;rules"
          --collect-all pptx --collect-all fitz --collect-all pymupdf
          app.py
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist/PPTStudio/
          Compress-Archive -Path dist/PPTStudio -DestinationPath PPTStudio-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PPTStudio-windows
          path: PPTStudio-windows.zip
      - name: Release (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PPT Studio (최신 빌드)
          files: PPTStudio-windows.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
